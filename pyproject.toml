[project]
name = "neural-alignment"
version = "0.1.0"
description = "Do brain-based reward models resist overoptimization?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "h5py>=3.16.0",
    "modal>=1.6.4",
    "nibabel>=5.4.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.123",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "scipy-stubs>=1.18.1.1",
    "types-tqdm>=4.70.0.20261102",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
